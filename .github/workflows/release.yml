name: Release APK
on:
  workflow_dispatch:
  push:
    branches: [my-edits]
jobs:
  build:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-java@v4
        with: { distribution: temurin, java-version: 17 }
      - uses: gradle/actions/setup-gradle@v4
      - name: Keystore'u çöz
        env:
          KEYSTORE_BASE64: ${{ secrets.KEYSTORE_BASE64 }}
        run: |
          printf '%s' "$KEYSTORE_BASE64" | tr -d '[:space:]' | base64 -d > "$RUNNER_TEMP/release.jks"
          test -s "$RUNNER_TEMP/release.jks" || { echo "Keystore bos, secret'i kontrol et"; exit 1; }
      - name: Release build
        env:
          KEYSTORE_FILE: ${{ runner.temp }}/release.jks
          KEYSTORE_PASSWORD: ${{ secrets.KEYSTORE_PASSWORD }}
          KEY_ALIAS: ${{ secrets.KEY_ALIAS }}
          KEY_PASSWORD: ${{ secrets.KEY_PASSWORD }}
        run: chmod +x gradlew && ./gradlew assembleRelease -PrequireSigning=true
      - uses: actions/upload-artifact@v4
        with:
          name: hexdroid-release
          path: app/build/outputs/apk/release/*.apk
      - name: Telegram'a APK gönder
        if: success()
        env:
          TG_TOKEN: ${{ secrets.TELEGRAM_BOT_TOKEN }}
          TG_CHAT: ${{ secrets.TELEGRAM_CHAT_ID }}
        run: |
          APK=$(ls app/build/outputs/apk/release/*.apk | head -n1)
          curl -sS -f \
            -F chat_id="$TG_CHAT" \
            -F document=@"$APK" \
            -F caption="HexDroid release - ${GITHUB_SHA::7}" \
            "https://api.telegram.org/bot${TG_TOKEN}/sendDocument"
      - name: Telegram'a hata bildir
        if: failure()
        env:
          TG_TOKEN: ${{ secrets.TELEGRAM_BOT_TOKEN }}
          TG_CHAT: ${{ secrets.TELEGRAM_CHAT_ID }}
        run: |
          curl -sS -f \
            -d chat_id="$TG_CHAT" \
            -d text="HexDroid build HATA verdi: ${GITHUB_SERVER_URL}/${GITHUB_REPOSITORY}/actions/runs/${GITHUB_RUN_ID}" \
            "https://api.telegram.org/bot${TG_TOKEN}/sendMessage"